# Tests — disabled for now (manual trigger only).
# Re-enable automatic runs by restoring push/pull_request triggers.
name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame numpy Pillow keyring
          pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
